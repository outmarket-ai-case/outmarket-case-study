{{- if .Values.externalSecrets.enabled }}
{{- $backend := required "platform.database.secretBackend is required when externalSecrets.enabled=true" .Values.platform.database.secretBackend }}
# The provider block is the single cloud-specific stanza in the delivery layer.
# Both branches resolve the same JSON secret shape, which is why the
# ExternalSecret below is identical on every cloud.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "idea-board.fullname" . }}
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq $backend "secretsmanager" }}
    aws:
      service: SecretsManager
      region: {{ required "platform.region is required for the AWS secret store" .Values.platform.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "idea-board.serviceAccountName" . }}
    {{- else if eq $backend "secretmanager" }}
    gcpsm:
      projectID: {{ required "platform.gcpProjectId is required for the GCP secret store" .Values.platform.gcpProjectId }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.platform.region }}
          clusterName: {{ required "platform.cluster.name is required" .Values.platform.cluster.name }}
          serviceAccountRef:
            name: {{ include "idea-board.serviceAccountName" . }}
    {{- else }}
    {{- fail (printf "unsupported secretBackend %q -- add a provider branch here when onboarding a cloud" $backend) }}
    {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "idea-board.fullname" . }}-db
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "idea-board.fullname" . }}
    kind: SecretStore
  target:
    name: {{ include "idea-board.dbSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # DATABASE_URL is assembled in-cluster. The password never appears in
        # Terraform state, CI logs, or a Helm values file.
        DATABASE_URL: >-
          postgresql+asyncpg://{{ .Values.platform.database.username }}:{{ `{{ .password | urlquery }}` }}@{{ .Values.platform.database.host }}:{{ .Values.platform.database.port }}/{{ .Values.platform.database.name }}?ssl=require
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "platform.database.secretRef is required" .Values.platform.database.secretRef }}
        property: password
{{- end }}
