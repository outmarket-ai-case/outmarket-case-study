{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "idea-board.serviceAccountName" . }}
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
  {{- with .Values.platform.serviceAccountAnnotations }}
  # IRSA role ARN on AWS, Workload Identity email on GCP -- passed straight
  # through from the contract so the chart never has to know which.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
