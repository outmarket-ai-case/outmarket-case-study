{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "idea-board.fullname" . }}
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
  annotations:
    {{- include "idea-board.ingressAnnotations" . | nindent 4 }}
spec:
  # ingressClassName comes from the contract: `alb` on EKS, `gce` on GKE,
  # `nginx` on kind. The rest of this manifest is provider-independent.
  ingressClassName: {{ .Values.platform.cluster.ingressClass }}
  {{- if and .Values.ingress.tls.enabled .Values.platform.appHostname }}
  tls:
    - hosts:
        - {{ .Values.platform.appHostname }}
      secretName: {{ default (printf "%s-tls" (include "idea-board.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{ if .Values.platform.appHostname }}host: {{ .Values.platform.appHostname | quote }}
      {{ end }}http:
        paths:
          # Everything reaches nginx, which serves the SPA and proxies /api.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "idea-board.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
