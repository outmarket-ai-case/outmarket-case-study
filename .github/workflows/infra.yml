name: infra

# Provisioning through the pipeline instead of someone's laptop.
#
# The safety model is plan-first: a pull request that touches infrastructure
# gets an automatic plan posted back to it, and an apply can only run from a
# deliberate manual dispatch. An apply never re-plans -- it downloads the exact
# plan file that was produced and reviewed, so what gets applied is what was
# read, even if main has moved underneath it.
#
# Destroys require typing the environment name, and prod is gated behind a
# GitHub Environment so it can require a reviewer.
#
# Callable, so release.yml can provision before it deploys and the whole path
# from merge to production is one run graph rather than two disconnected ones.

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud
        type: choice
        options: [aws, gcp]
        default: aws
      environment:
        description: Environment name (must have infra/terraform/envs/<cloud>-<env>.tfvars)
        type: string
        default: dev
      action:
        description: What to do
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: For destroy only — retype the environment name
        type: string
        default: ""

  # Called by release.yml. Same jobs, same gates -- a provisioning run is not
  # any less reviewed for having been started by another workflow.
  workflow_call:
    inputs:
      cloud:
        type: string
        required: true
      environment:
        type: string
        required: true
      action:
        type: string
        default: plan
      confirm:
        type: string
        default: ""
      fail_on_changes:
        # Drift detection inverts the usual meaning of a plan: finding changes
        # is the bad outcome, because nobody asked for them. Each matrix leg
        # then goes red on its own, which says *which* environment drifted
        # without any cross-job output aggregation.
        type: boolean
        default: false
    outputs:
      changes:
        description: Whether the plan found anything to change
        value: ${{ jobs.plan.outputs.changes }}
      applied:
        description: Whether an apply actually ran
        value: ${{ jobs.apply.outputs.applied }}

permissions:
  contents: read

# Never let two runs touch the same state at once, and never cancel a running
# apply -- an interrupted apply is how state ends up disagreeing with reality.
concurrency:
  group: infra-${{ inputs.cloud || 'pr' }}-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.8
  CLOUD: ${{ inputs.cloud || 'aws' }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ---------------------------------------------------------------- validate
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formatting
        run: terraform fmt -check -recursive infra/terraform

      # No backend and no credentials needed: this only checks the
      # configuration is internally consistent.
      - name: Validate both stacks
        run: |
          set -euo pipefail
          for stack in aws gcp; do
            echo "::group::$stack"
            terraform -chdir="infra/terraform/stacks/$stack" init -backend=false -input=false
            terraform -chdir="infra/terraform/stacks/$stack" validate
            echo "::endgroup::"
          done

  # ----------------------------------------------------------------- state
  # The backend has to exist before Terraform can describe it, so it cannot be
  # Terraform. This job makes it the pipeline's job instead of a page of setup
  # instructions that drift out of date.
  #
  # The dangerous version of this feature is auto-creating whatever bucket name
  # it is handed: a typo in TF_STATE_BUCKET would silently produce an empty
  # bucket, a plan that wants to create everything, and -- after an apply --
  # a second copy of your infrastructure with the first copy orphaned and
  # unmanaged. So the two cases are treated differently:
  #
  #   name given explicitly  -> it must already exist. A missing named bucket
  #                             is a typo, and we fail rather than guess.
  #   no name given          -> derive it from the account id, which nobody
  #                             types, so there is no typo to make. Create it
  #                             if it is not there.
  bootstrap:
    name: state backend (${{ inputs.cloud || 'aws' }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      bucket: ${{ steps.aws.outputs.bucket || steps.gcp.outputs.bucket }}
      lock_table: ${{ steps.aws.outputs.lock_table }}
      first_run: ${{ steps.aws.outputs.first_run || steps.gcp.outputs.first_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authenticate to GCP
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Ensure the S3 backend
        id: aws
        if: env.CLOUD == 'aws'
        env:
          GIVEN_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"

          if [ -n "${GIVEN_BUCKET}" ]; then
            bucket="${GIVEN_BUCKET}"
            if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "::error::TF_STATE_BUCKET is set to '$bucket', which does not exist or is not readable."
              echo "A bucket named explicitly is never created automatically: if the name is a typo,"
              echo "creating it would plan against empty state and apply a second copy of your"
              echo "infrastructure, orphaning the first. Fix the secret, or unset it to let this"
              echo "pipeline manage a bucket named after the account."
              exit 1
            fi
            echo "reusing the configured bucket: $bucket"
          else
            # Derived, not typed. There is no typo to make.
            bucket="idea-board-tfstate-${account}-${REGION}"
            if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "reusing the managed bucket: $bucket"
            else
              echo "creating the state bucket: $bucket"
              # us-east-1 is the one region that rejects a LocationConstraint.
              if [ "$REGION" = "us-east-1" ]; then
                aws s3api create-bucket --bucket "$bucket" --region "$REGION"
              else
                aws s3api create-bucket --bucket "$bucket" --region "$REGION" \
                  --create-bucket-configuration "LocationConstraint=${REGION}"
              fi
              aws s3api wait bucket-exists --bucket "$bucket"
            fi
          fi

          # Idempotent, and applied to a pre-existing bucket too: a state bucket
          # without versioning is one bad apply away from unrecoverable, and
          # that is worth enforcing even on a bucket someone else created.
          aws s3api put-bucket-versioning --bucket "$bucket" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$bucket" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          # State locking. Terraform 1.9's S3 backend still locks through
          # DynamoDB; 1.10+ can use S3 conditional writes (`use_lockfile`)
          # instead, at which point this table can go away.
          lock_table="idea-board-tfstate-locks"
          if aws dynamodb describe-table --table-name "$lock_table" >/dev/null 2>&1; then
            echo "reusing the lock table: $lock_table"
          else
            echo "creating the lock table: $lock_table"
            aws dynamodb create-table --table-name "$lock_table" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "$lock_table"
          fi

          # Does this environment already have state? A plan that says "40 to
          # add" is correct on a first stand-up and alarming on an existing
          # environment, and the reviewer should not have to guess which it is.
          if aws s3api head-object --bucket "$bucket" \
               --key "idea-board/${ENVIRONMENT}/terraform.tfstate" >/dev/null 2>&1; then
            first_run=false
          else
            first_run=true
          fi

          {
            echo "bucket=$bucket"
            echo "lock_table=$lock_table"
            echo "first_run=$first_run"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure the GCS backend
        id: gcp
        if: env.CLOUD == 'gcp'
        env:
          GIVEN_BUCKET: ${{ secrets.TF_STATE_BUCKET_GCP }}
        run: |
          set -euo pipefail
          # The project is already declared in the environment's tfvars, so it
          # is one less thing to configure twice and get inconsistent.
          project="$(grep -E '^\s*project_id' "infra/terraform/envs/gcp-${ENVIRONMENT}.tfvars" \
                     | head -1 | cut -d'"' -f2)"
          [ -n "$project" ] || { echo "::error::no project_id in gcp-${ENVIRONMENT}.tfvars"; exit 1; }

          if [ -n "${GIVEN_BUCKET}" ]; then
            bucket="${GIVEN_BUCKET}"
            if ! gcloud storage buckets describe "gs://${bucket}" >/dev/null 2>&1; then
              echo "::error::TF_STATE_BUCKET_GCP is set to '$bucket', which does not exist."
              echo "See the AWS branch of this job for why a named bucket is never auto-created."
              exit 1
            fi
            echo "reusing the configured bucket: $bucket"
          else
            bucket="idea-board-tfstate-${project}"
            if gcloud storage buckets describe "gs://${bucket}" >/dev/null 2>&1; then
              echo "reusing the managed bucket: $bucket"
            else
              echo "creating the state bucket: $bucket"
              gcloud storage buckets create "gs://${bucket}" \
                --project="$project" --location=EU \
                --uniform-bucket-level-access --public-access-prevention
            fi
          fi
          # GCS locks through object generation preconditions, so there is no
          # lock table to create -- only versioning to guarantee.
          gcloud storage buckets update "gs://${bucket}" --versioning

          if gcloud storage objects describe \
               "gs://${bucket}/idea-board/${ENVIRONMENT}/default.tfstate" >/dev/null 2>&1; then
            first_run=false
          else
            first_run=true
          fi
          { echo "bucket=$bucket"; echo "first_run=$first_run"; } >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo "### State backend"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| bucket | \`${{ steps.aws.outputs.bucket || steps.gcp.outputs.bucket }}\` |"
            echo "| lock | \`${{ steps.aws.outputs.lock_table || 'GCS generation preconditions' }}\` |"
            echo "| existing state for \`${ENVIRONMENT}\` | ${{ (steps.aws.outputs.first_run || steps.gcp.outputs.first_run) == 'true' && 'none — first stand-up' || 'yes' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------- plan
  plan:
    name: plan (${{ inputs.cloud || 'aws' }}/${{ inputs.environment || 'dev' }})
    needs: [validate, bootstrap]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation: no long-lived cloud keys in this repo
      pull-requests: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check the environment exists
        run: |
          set -euo pipefail
          f="infra/terraform/envs/${CLOUD}-${ENVIRONMENT}.tfvars"
          if [ ! -f "$f" ]; then
            echo "::error::$f does not exist."
            echo "Environments are defined by a committed tfvars file so the change is reviewable."
            echo "Add the environment to platform.yaml, run the ai-env-plan workflow to generate"
            echo "its tfvars, and merge that before provisioning."
            exit 1
          fi
          echo "using $f"

      - name: Authenticate to AWS
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # The bucket comes from the bootstrap job rather than from a secret, so
      # plan and apply cannot end up pointed at different state -- which would
      # otherwise be possible, since apply replays a plan the other job made.
      - name: Initialise the ${{ env.CLOUD }} stack
        env:
          BUCKET: ${{ needs.bootstrap.outputs.bucket }}
          LOCK_TABLE: ${{ needs.bootstrap.outputs.lock_table }}
        run: |
          set -euo pipefail
          if [ "$CLOUD" = "aws" ]; then
            terraform -chdir="infra/terraform/stacks/aws" init -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=idea-board/${ENVIRONMENT}/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${LOCK_TABLE}" \
              -backend-config="encrypt=true"
          else
            terraform -chdir="infra/terraform/stacks/gcp" init -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="prefix=idea-board/${ENVIRONMENT}"
          fi

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          stack="infra/terraform/stacks/${CLOUD}"
          args=(-input=false -lock-timeout=5m -out=tfplan \
                -var-file="${GITHUB_WORKSPACE}/infra/terraform/envs/${CLOUD}-${ENVIRONMENT}.tfvars")
          if [ "${{ inputs.action }}" = "destroy" ]; then
            args+=(-destroy)
          fi

          set +e
          terraform -chdir="$stack" plan -detailed-exitcode "${args[@]}"
          code=$?
          set -e

          # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

          if [ "${{ inputs.fail_on_changes || false }}" = "true" ] && [ "$code" = "2" ]; then
            echo "::error::${CLOUD}/${ENVIRONMENT} has drifted from its committed configuration."
            drifted=1
          fi

          terraform -chdir="$stack" show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan — ${CLOUD}/${ENVIRONMENT}"
            echo
            if [ "${{ inputs.action }}" = "destroy" ]; then echo "> **This is a DESTROY plan.**"; echo; fi
            # "40 to add" is correct on a first stand-up and alarming on a live
            # environment. Say which this is, so nobody has to infer it.
            if [ "${{ needs.bootstrap.outputs.first_run }}" = "true" ]; then
              echo "> This environment has **no existing state** — a first stand-up."; echo
            fi
            echo '```terraform'
            # The summary has a size limit, so keep the tail where the
            # "Plan: x to add" line lives.
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail last: the plan above is the whole point of the run.
          [ "${drifted:-0}" = "1" ] && exit 1 || true

      # The binary plan is what apply consumes, so the applied change is
      # exactly the reviewed one.
      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.CLOUD }}-${{ env.ENVIRONMENT }}
          path: |
            infra/terraform/stacks/${{ env.CLOUD }}/tfplan
            plan.txt
          retention-days: 5

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.txt', 'utf8');
            const clipped = body.length > 55000 ? body.slice(-55000) : body;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Terraform plan — `${{ env.CLOUD }}/${{ env.ENVIRONMENT }}`',
                '',
                '```terraform',
                clipped,
                '```',
                '',
                '_Plans only. Applying is a manual dispatch of the `infra` workflow._',
              ].join('\n'),
            });

  # ------------------------------------------------------------------- apply
  apply:
    name: ${{ inputs.action }} (${{ inputs.cloud }}/${{ inputs.environment }})
    needs: [bootstrap, plan]
    # Never from a pull request, and never unless the action asked for it.
    # Checking the event name negatively rather than positively matters: under
    # workflow_call the event is the *caller's* (a push), so an allowlist of
    # 'workflow_dispatch' would silently make every chained apply a no-op.
    if: >-
      github.event_name != 'pull_request' &&
      (inputs.action == 'apply' || inputs.action == 'destroy') &&
      needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # A GitHub Environment of this name can require a reviewer, which is how
    # prod gets a human in the loop without any logic here.
    environment: infra-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      applied: ${{ steps.applied.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Require the environment name for a destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${ENVIRONMENT}" ]; then
            echo "::error::Destroy refused. Retype the environment name in 'confirm' to proceed."
            exit 1
          fi
          echo "destroy confirmed for ${ENVIRONMENT}"

      - name: Authenticate to AWS
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.CLOUD }}-${{ env.ENVIRONMENT }}
          path: artifact

      # The bucket comes from the bootstrap job rather than from a secret, so
      # plan and apply cannot end up pointed at different state -- which would
      # otherwise be possible, since apply replays a plan the other job made.
      - name: Initialise the ${{ env.CLOUD }} stack
        env:
          BUCKET: ${{ needs.bootstrap.outputs.bucket }}
          LOCK_TABLE: ${{ needs.bootstrap.outputs.lock_table }}
        run: |
          set -euo pipefail
          if [ "$CLOUD" = "aws" ]; then
            terraform -chdir="infra/terraform/stacks/aws" init -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=idea-board/${ENVIRONMENT}/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${LOCK_TABLE}" \
              -backend-config="encrypt=true"
          else
            terraform -chdir="infra/terraform/stacks/gcp" init -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="prefix=idea-board/${ENVIRONMENT}"
          fi

      - name: Apply the reviewed plan
        run: |
          set -euo pipefail
          stack="infra/terraform/stacks/${CLOUD}"
          cp "artifact/infra/terraform/stacks/${CLOUD}/tfplan" "${stack}/tfplan"
          # No -var-file here on purpose: a saved plan already contains every
          # value, and passing them again would let them differ from what was
          # reviewed.
          terraform -chdir="$stack" apply -input=false -lock-timeout=5m -auto-approve tfplan

      - id: applied
        run: echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Publish the platform contract
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          {
            echo "## ${CLOUD}/${ENVIRONMENT} is provisioned"
            echo
            echo 'Deploy the application to it with the **deploy** workflow, or locally:'
            echo
            echo '```bash'
            echo "scripts/deploy.sh ${CLOUD} ${ENVIRONMENT} \"sha-\$(git rev-parse --short HEAD)\""
            echo '```'
            echo
            echo '<details><summary>Platform contract</summary>'
            echo
            echo '```json'
            terraform -chdir="infra/terraform/stacks/${CLOUD}" output -json platform | jq '.'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
