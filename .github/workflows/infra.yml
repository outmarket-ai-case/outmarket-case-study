name: infra

# Provisioning through the pipeline instead of someone's laptop.
#
# The safety model is plan-first: a pull request that touches infrastructure
# gets an automatic plan posted back to it, and an apply can only run from a
# deliberate manual dispatch. An apply never re-plans -- it downloads the exact
# plan file that was produced and reviewed, so what gets applied is what was
# read, even if main has moved underneath it.
#
# Destroys require typing the environment name, and prod is gated behind a
# GitHub Environment so it can require a reviewer.
#
# Callable, so release.yml can provision before it deploys and the whole path
# from merge to production is one run graph rather than two disconnected ones.

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud
        type: choice
        options: [aws, gcp]
        default: aws
      environment:
        description: Environment name (must have infra/terraform/envs/<cloud>-<env>.tfvars)
        type: string
        default: dev
      action:
        description: What to do
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: For destroy only — retype the environment name
        type: string
        default: ""

  # Called by release.yml. Same jobs, same gates -- a provisioning run is not
  # any less reviewed for having been started by another workflow.
  workflow_call:
    inputs:
      cloud:
        type: string
        required: true
      environment:
        type: string
        required: true
      action:
        type: string
        default: plan
      confirm:
        type: string
        default: ""
    outputs:
      changes:
        description: Whether the plan found anything to change
        value: ${{ jobs.plan.outputs.changes }}
      applied:
        description: Whether an apply actually ran
        value: ${{ jobs.apply.outputs.applied }}

permissions:
  contents: read

# Never let two runs touch the same state at once, and never cancel a running
# apply -- an interrupted apply is how state ends up disagreeing with reality.
concurrency:
  group: infra-${{ inputs.cloud || 'pr' }}-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.8
  CLOUD: ${{ inputs.cloud || 'aws' }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ---------------------------------------------------------------- validate
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formatting
        run: terraform fmt -check -recursive infra/terraform

      # No backend and no credentials needed: this only checks the
      # configuration is internally consistent.
      - name: Validate both stacks
        run: |
          set -euo pipefail
          for stack in aws gcp; do
            echo "::group::$stack"
            terraform -chdir="infra/terraform/stacks/$stack" init -backend=false -input=false
            terraform -chdir="infra/terraform/stacks/$stack" validate
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------- plan
  plan:
    name: plan (${{ inputs.cloud || 'aws' }}/${{ inputs.environment || 'dev' }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation: no long-lived cloud keys in this repo
      pull-requests: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check the environment exists
        run: |
          set -euo pipefail
          f="infra/terraform/envs/${CLOUD}-${ENVIRONMENT}.tfvars"
          if [ ! -f "$f" ]; then
            echo "::error::$f does not exist."
            echo "Environments are defined by a committed tfvars file so the change is reviewable."
            echo "Add the environment to platform.yaml, run the ai-env-plan workflow to generate"
            echo "its tfvars, and merge that before provisioning."
            exit 1
          fi
          echo "using $f"

      - name: Authenticate to AWS
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Initialise the ${{ env.CLOUD }} stack
        run: |
          set -euo pipefail
          if [ "$CLOUD" = "aws" ]; then
            terraform -chdir="infra/terraform/stacks/aws" init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="key=idea-board/${ENVIRONMENT}/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}"
          else
            terraform -chdir="infra/terraform/stacks/gcp" init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_GCP }}" \
              -backend-config="prefix=idea-board/${ENVIRONMENT}"
          fi

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          stack="infra/terraform/stacks/${CLOUD}"
          args=(-input=false -lock-timeout=5m -out=tfplan \
                -var-file="${GITHUB_WORKSPACE}/infra/terraform/envs/${CLOUD}-${ENVIRONMENT}.tfvars")
          if [ "${{ inputs.action }}" = "destroy" ]; then
            args+=(-destroy)
          fi

          set +e
          terraform -chdir="$stack" plan -detailed-exitcode "${args[@]}"
          code=$?
          set -e

          # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

          terraform -chdir="$stack" show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan — ${CLOUD}/${ENVIRONMENT}"
            echo
            if [ "${{ inputs.action }}" = "destroy" ]; then echo "> **This is a DESTROY plan.**"; echo; fi
            echo '```terraform'
            # The summary has a size limit, so keep the tail where the
            # "Plan: x to add" line lives.
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The binary plan is what apply consumes, so the applied change is
      # exactly the reviewed one.
      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.CLOUD }}-${{ env.ENVIRONMENT }}
          path: |
            infra/terraform/stacks/${{ env.CLOUD }}/tfplan
            plan.txt
          retention-days: 5

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.txt', 'utf8');
            const clipped = body.length > 55000 ? body.slice(-55000) : body;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Terraform plan — `${{ env.CLOUD }}/${{ env.ENVIRONMENT }}`',
                '',
                '```terraform',
                clipped,
                '```',
                '',
                '_Plans only. Applying is a manual dispatch of the `infra` workflow._',
              ].join('\n'),
            });

  # ------------------------------------------------------------------- apply
  apply:
    name: ${{ inputs.action }} (${{ inputs.cloud }}/${{ inputs.environment }})
    needs: plan
    # Never from a pull request, and never unless the action asked for it.
    # Checking the event name negatively rather than positively matters: under
    # workflow_call the event is the *caller's* (a push), so an allowlist of
    # 'workflow_dispatch' would silently make every chained apply a no-op.
    if: >-
      github.event_name != 'pull_request' &&
      (inputs.action == 'apply' || inputs.action == 'destroy') &&
      needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # A GitHub Environment of this name can require a reviewer, which is how
    # prod gets a human in the loop without any logic here.
    environment: infra-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      applied: ${{ steps.applied.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Require the environment name for a destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${ENVIRONMENT}" ]; then
            echo "::error::Destroy refused. Retype the environment name in 'confirm' to proceed."
            exit 1
          fi
          echo "destroy confirmed for ${ENVIRONMENT}"

      - name: Authenticate to AWS
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.CLOUD }}-${{ env.ENVIRONMENT }}
          path: artifact

      - name: Initialise the ${{ env.CLOUD }} stack
        run: |
          set -euo pipefail
          if [ "$CLOUD" = "aws" ]; then
            terraform -chdir="infra/terraform/stacks/aws" init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="key=idea-board/${ENVIRONMENT}/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}"
          else
            terraform -chdir="infra/terraform/stacks/gcp" init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_GCP }}" \
              -backend-config="prefix=idea-board/${ENVIRONMENT}"
          fi

      - name: Apply the reviewed plan
        run: |
          set -euo pipefail
          stack="infra/terraform/stacks/${CLOUD}"
          cp "artifact/infra/terraform/stacks/${CLOUD}/tfplan" "${stack}/tfplan"
          # No -var-file here on purpose: a saved plan already contains every
          # value, and passing them again would let them differ from what was
          # reviewed.
          terraform -chdir="$stack" apply -input=false -lock-timeout=5m -auto-approve tfplan

      - id: applied
        run: echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Publish the platform contract
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          {
            echo "## ${CLOUD}/${ENVIRONMENT} is provisioned"
            echo
            echo 'Deploy the application to it with the **deploy** workflow, or locally:'
            echo
            echo '```bash'
            echo "scripts/deploy.sh ${CLOUD} ${ENVIRONMENT} \"sha-\$(git rev-parse --short HEAD)\""
            echo '```'
            echo
            echo '<details><summary>Platform contract</summary>'
            echo
            echo '```json'
            terraform -chdir="infra/terraform/stacks/${CLOUD}" output -json platform | jq '.'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
