name: deploy

# One workflow deploys to every cloud. The matrix is the only place a provider
# name appears -- the steps below are identical for each, because everything
# provider-shaped is read out of the Terraform platform contract at run time.
# Triggers: a manual dispatch for break-glass, and a workflow_call from
# release.yml, which is what runs on a merge. Deliberately no `push:` --
# release.yml owns the merge path, and two workflows racing to deploy the same
# environment from the same commit is how you get a rollback fighting a rollout.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
      clouds:
        description: Comma-separated clouds (aws, gcp)
        type: string
        default: aws,gcp

  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      clouds:
        type: string
        default: aws,gcp
    outputs:
      image_tag:
        description: The immutable tag that was deployed
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  contents: read
  id-token: write # OIDC federation: no long-lived cloud keys in this repo
  packages: write

# Two rollouts of the same environment at once means Helm's release history is
# being written by two processes, and a rollback can revert to a revision the
# other one just superseded. Queue instead, and never cancel: a cancelled
# `helm upgrade --atomic` leaves nothing to do the reverting.
concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ------------------------------------------------------------------
  # Build once. The same image digest is what every cloud deploys, so a
  # green deploy on AWS and a red one on GCP can never be blamed on
  # different bits.
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      clouds: ${{ steps.clouds.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      # The deploy matrix is built from this rather than hardcoded, so someone
      # with only one cloud configured does not get a guaranteed red job for
      # the other one.
      - name: Resolve target clouds
        id: clouds
        run: |
          set -euo pipefail
          raw="${{ inputs.clouds || 'aws,gcp' }}"
          list=$(tr ',' '\n' <<<"$raw" | tr -d ' ' | grep -v '^$' | jq -R . | jq -cs .)
          for c in $(jq -r '.[]' <<<"$list"); do
            case "$c" in
              aws|gcp) ;;
              *) echo "::error::unknown cloud '$c' (expected aws or gcp)"; exit 1 ;;
            esac
          done
          echo "deploying to: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and export both images
        run: |
          docker buildx build --tag "idea-board-backend:${{ steps.tag.outputs.tag }}" \
            --output type=docker,dest=/tmp/backend.tar ./backend
          # Root context: the frontend image ships docs/ and README.md.
          docker buildx build --tag "idea-board-frontend:${{ steps.tag.outputs.tag }}" \
            --file ./frontend/Dockerfile \
            --output type=docker,dest=/tmp/frontend.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ env.ENVIRONMENT }}-${{ steps.tag.outputs.tag }}
          path: /tmp/*.tar
          retention-days: 3

  # ------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failure on one cloud must not hide the other's result
      matrix:
        cloud: ${{ fromJSON(needs.build.outputs.clouds) }}
    environment: ${{ inputs.environment || 'dev' }} # GitHub environment gates prod on approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ env.ENVIRONMENT }}-${{ needs.build.outputs.image_tag }}
          path: /tmp
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/setup-helm@v4

      # --- the only provider-specific steps in the entire pipeline ---
      - name: Authenticate to AWS
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authenticate to GCP
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install the GKE auth plugin
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # Resolve the state bucket exactly as infra's bootstrap job does -- but
      # read-only. Deploy must never create a backend: a deploy that finds no
      # state has found a missing environment, and quietly manufacturing an
      # empty bucket would turn that into a much more confusing failure.
      - name: Resolve the state backend
        id: backend
        env:
          GIVEN_AWS: ${{ secrets.TF_STATE_BUCKET }}
          GIVEN_GCP: ${{ secrets.TF_STATE_BUCKET_GCP }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            if [ -n "${GIVEN_AWS}" ]; then
              bucket="${GIVEN_AWS}"
            else
              bucket="idea-board-tfstate-$(aws sts get-caller-identity --query Account --output text)-${REGION}"
            fi
          else
            if [ -n "${GIVEN_GCP}" ]; then
              bucket="${GIVEN_GCP}"
            else
              project="$(grep -E '^\s*project_id' "infra/terraform/envs/gcp-${ENVIRONMENT}.tfvars" | head -1 | cut -d'"' -f2)"
              bucket="idea-board-tfstate-${project}"
            fi
          fi
          echo "state bucket: $bucket"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Initialise the ${{ matrix.cloud }} stack
        env:
          BUCKET: ${{ steps.backend.outputs.bucket }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            terraform -chdir="infra/terraform/stacks/aws" init -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="key=idea-board/${ENVIRONMENT}/terraform.tfstate" \
              -backend-config="region=${REGION}" \
              -backend-config="dynamodb_table=idea-board-tfstate-locks" \
              -backend-config="encrypt=true"
          else
            terraform -chdir="infra/terraform/stacks/gcp" init -input=false \
              -backend-config="bucket=${BUCKET}" \
              -backend-config="prefix=idea-board/${ENVIRONMENT}"
          fi

      # Provisioning is a separate workflow on a separate cadence, so deploy
      # has to assume nothing is there. Without this the first deploy to an
      # un-provisioned environment dies inside a jq filter on an empty string,
      # which reads like a bug in the pipeline rather than a missing cluster.
      - name: Check the environment is provisioned
        run: |
          set -euo pipefail
          stack="infra/terraform/stacks/${{ matrix.cloud }}"
          if ! terraform -chdir="$stack" output -json platform > /tmp/platform.json 2>/dev/null \
             || [ "$(jq -r 'type' /tmp/platform.json 2>/dev/null)" != "object" ]; then
            echo "::error::${{ matrix.cloud }}/${ENVIRONMENT} has no platform contract in its Terraform state."
            echo "It has not been provisioned, or it was provisioned against a different state key."
            echo
            echo "Provision it first -- infra is a separate workflow on purpose:"
            echo "  gh workflow run infra.yml -f cloud=${{ matrix.cloud }} -f environment=${ENVIRONMENT} -f action=plan"
            echo "  gh workflow run infra.yml -f cloud=${{ matrix.cloud }} -f environment=${ENVIRONMENT} -f action=apply"
            exit 1
          fi
          echo "contract schema_version: $(jq -r '.schema_version' /tmp/platform.json)"

      # From here down, nothing knows which cloud it is on.
      - name: Load images into the cluster's registry
        run: |
          set -euo pipefail
          PLATFORM="$(terraform -chdir=infra/terraform/stacks/${{ matrix.cloud }} output -json platform)"
          eval "$(jq -r '.registry.login_command' <<<"$PLATFORM")"
          HOST="$(jq -r '.registry.host' <<<"$PLATFORM")"
          PREFIX="$(jq -r '.registry.repository_prefix' <<<"$PLATFORM")"
          TAG="${{ needs.build.outputs.image_tag }}"
          for component in backend frontend; do
            docker load --input "/tmp/${component}.tar"
            docker tag "idea-board-${component}:${TAG}" "${HOST}/${PREFIX}/${component}:${TAG}"
            docker push "${HOST}/${PREFIX}/${component}:${TAG}"
          done

      - name: Deploy
        run: scripts/deploy.sh "${{ matrix.cloud }}" "${ENVIRONMENT}" "${{ needs.build.outputs.image_tag }}"

      # Someone who deploys from the Actions tab has no kubectl to ask where
      # the thing they just shipped is running. Printing the URL into the run
      # summary is the difference between a pipeline anyone can use and one
      # that needs a laptop to finish the job.
      - name: Publish the URL
        run: |
          set -euo pipefail
          ns="idea-board-${ENVIRONMENT}"
          # A freshly created load balancer has no address for a minute or two.
          for _ in $(seq 1 30); do
            # By label, not by name: the chart derives the resource name, and
            # a nameOverride would quietly break a hardcoded one.
            addr="$(kubectl -n "$ns" get ingress -l app.kubernetes.io/name=idea-board \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            [ -n "$addr" ] && break
            sleep 10
          done
          {
            echo "## ${{ matrix.cloud }} · ${ENVIRONMENT}"
            echo
            if [ -n "${addr:-}" ]; then
              echo "### http://${addr}"
              echo
              echo "Image \`${{ needs.build.outputs.image_tag }}\`. A new load balancer can take"
              echo "a few more minutes to answer, and DNS longer still."
            else
              echo "Deployed, but the ingress has no address yet. Re-check with:"
              echo
              echo '```'
              echo "kubectl -n ${ns} get ingress -l app.kubernetes.io/name=idea-board"
              echo '```'
            fi
            echo
            kubectl -n "$ns" get deploy,pods --no-headers 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- the AI release gate ----------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai/requirements.txt
      - name: AI release gate
        id: gate
        working-directory: ai
        continue-on-error: true # the gate's exit code is handled explicitly below
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m aiops gate \
            --namespace "idea-board-${ENVIRONMENT}" \
            --release idea-board \
            --output "$GITHUB_STEP_SUMMARY" \
            --json /tmp/verdict.json

      - name: Roll back on a failed release
        if: steps.gate.outcome == 'failure' && steps.gate.conclusion != 'skipped'
        run: |
          set -euo pipefail
          # Exit 1 means the gate demands a rollback; exit 2 means degraded and
          # a human should look. Only the former reverts automatically.
          if [ "$(jq -r '.should_rollback' /tmp/verdict.json)" = "true" ]; then
            echo "::error::Release gate demanded a rollback on ${{ matrix.cloud }}"
            jq -r '.summary' /tmp/verdict.json
            helm rollback idea-board -n "idea-board-${ENVIRONMENT}" --wait --timeout 10m
            exit 1
          fi
          echo "::warning::Release is degraded on ${{ matrix.cloud }} but was left running for review"
          jq -r '.summary' /tmp/verdict.json
